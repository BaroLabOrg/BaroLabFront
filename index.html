<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>BaroLab — Barotrauma Database, Mods &amp; Tools</title>
    <meta name="description" content="Explore Barotrauma game data, items, creatures, crafting, mods, submarines, guides and load-order tools on BaroLab." />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BaroLab" />
    <meta property="og:title" content="BaroLab — Barotrauma Database, Mods &amp; Tools" />
    <meta property="og:description" content="Explore Barotrauma game data, items, creatures, crafting, mods, submarines, guides and load-order tools." />
    <meta property="og:url" content="https://barolab.org/" />
    <meta property="og:image" content="https://barolab.org/og-barolab.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BaroLab — Barotrauma Database, Mods &amp; Tools" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BaroLab — Barotrauma Database, Mods &amp; Tools" />
    <meta name="twitter:description" content="Explore Barotrauma game data, items, creatures, crafting, mods, submarines, guides and load-order tools." />
    <meta name="twitter:image" content="https://barolab.org/og-barolab.png" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BaroLab",
      "url": "https://barolab.org/",
      "description": "Independent Barotrauma community platform for structured game data, mods, submarines, guides and tools.",
      "inLanguage": "en"
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BaroLab",
      "url": "https://barolab.org/",
      "logo": "https://barolab.org/favicon.svg",
      "description": "Independent community project for Barotrauma players, modders and submarine creators.",
      "sameAs": [
        "https://github.com/BaroLabOrg"
      ]
    }
    </script>

    <!-- Fonts — Tactical Rust design system: Orbitron (display), Rajdhani (headings),
         JetBrains Mono (telemetry/meta), Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
